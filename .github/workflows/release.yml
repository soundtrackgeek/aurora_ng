# Pushing a tag like v0.2.0 builds the Windows app and publishes it as a
# GitHub Release. The in-app updater downloads the exe from the latest release.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      # rustup installs the toolchain pinned in rust-toolchain.toml.
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Aurora NG $GITHUB_REF_NAME" > notes.md

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp target/release/aurora_ng.exe aurora_ng-windows-x64.exe
          gh release create "$GITHUB_REF_NAME" aurora_ng-windows-x64.exe \
            --title "Aurora NG $GITHUB_REF_NAME" \
            --notes-file notes.md
