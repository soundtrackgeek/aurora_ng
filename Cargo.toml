[package]
name = "aurora_ng"
version = "0.12.0"
description = "Aurora rebuilt natively with Rust and GPUI: browse the library and play music"
authors = ["Jørn Tillnes"]
edition = "2024"
rust-version = "1.95"

[dependencies]
anyhow = "1"
gpui = "0.2.2"
id3 = "1.17.0"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png"] }
rodio = { version = "0.23.0", default-features = false, features = ["playback", "mp3", "flac", "mp4", "vorbis", "wav"] }
rusqlite = { version = "0.42.0", features = ["bundled", "functions"] }
self-replace = "1.5.1"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
ureq = { version = "3.5.1", features = ["json"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
tempfile = "3"

[build-dependencies]
embed-resource = "3"

# Same version as GPUI uses, so it adds little to the build.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_System_Com", "Win32_UI_Shell"] }
